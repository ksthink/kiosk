<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: blob: banner:; style-src 'self' 'unsafe-inline'; script-src 'self' file:">
  <title>행사 관리</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="top">
    <h1>행사 <span id="count" class="count"></span></h1>
    <button id="addBtn" class="primary big" type="button">＋ 행사 등록</button>
  </header>

  <p id="hint" class="hint" hidden>끌어서 순서를 바꿀 수 있어요</p>
  <ol id="list" class="list"></ol>

  <div id="emptyMsg" class="emptymsg" hidden>
    <button id="emptyAdd" type="button" class="drop">
      <b>＋</b>
      <span>행사 등록</span>
    </button>
  </div>

  <details class="settings">
    <summary>설정</summary>
    <form id="settings">
      <label>넘김 간격 <output id="secOut"></output>
        <input type="range" name="slideSeconds" min="3" max="30" step="1">
      </label>
      <label class="chk"><input type="checkbox" name="startFullscreen"> 켜면 바로 전체화면</label>
      <label>상태 읽는 위치
        <input name="defaultSelector" spellcheck="false">
      </label>
      <button id="crawlAll" type="button">지금 상태 다시 확인</button>
    </form>
  </details>

  <dialog id="dlg">
    <form id="form" method="dialog">
      <h2 id="dlgTitle">행사 등록</h2>
      <button id="drop" type="button" class="drop">
        <b>＋</b>
        <span>포스터 이미지</span>
      </button>
      <input id="url" name="url" type="url" placeholder="행사 페이지 주소 (https://…)" required>
      <p id="err" class="err" hidden></p>
      <div class="actions">
        <button id="delBtn" type="button" class="danger" hidden>삭제</button>
        <span class="spacer"></span>
        <button id="cancelBtn" type="button">취소</button>
        <button id="okBtn" type="submit" class="primary">등록</button>
      </div>
    </form>
  </dialog>

  <script src="admin.js"></script>
</body>
</html>
