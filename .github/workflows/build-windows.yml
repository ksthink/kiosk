name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (zip + portable exe)
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 모든 빌드: Actions 실행 화면의 Artifacts에서 내려받기 (GitHub 로그인 필요)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BannerGallery-${{ github.sha }}
          path: |
            dist/BannerGallery-win-x64.zip
            dist/BannerGallery.exe
          retention-days: 30

      # main 푸시(또는 수동 실행)마다 Releases에 새 버전으로 exe 첨부 → 태그는 Actions가 직접 만듦
      # 항상 최신 exe: https://github.com/<owner>/<repo>/releases/latest/download/BannerGallery.exe
      - name: Publish release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BannerGallery build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/BannerGallery-win-x64.zip
            dist/BannerGallery.exe
          generate_release_notes: true
          make_latest: true

      # v1.2.0처럼 v로 시작하는 태그를 직접 푸시한 경우
      - name: Publish release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BannerGallery-win-x64.zip
            dist/BannerGallery.exe
          generate_release_notes: true
          make_latest: true
