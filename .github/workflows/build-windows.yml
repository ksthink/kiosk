name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable exe
        run: npx electron-builder --win portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 모든 빌드: Actions 실행 화면의 Artifacts에서 내려받기 (GitHub 로그인 필요)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BannerGallery-${{ github.sha }}
          path: dist/BannerGallery.exe
          retention-days: 30

      # v로 시작하는 태그를 푸시하면: Releases 페이지에 exe 첨부
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BannerGallery.exe
          generate_release_notes: true
